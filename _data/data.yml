experiences:
    title: Experiences
    info:
      - role: Site Reliability Engineer
        time: September 2024 - August 2025
        company: Qynapse, Paris (CDI, Full-Remote)
        details: |
          Qynapse is a startup building AI-powered software to help neurologists diagnose and monitor 
          neurodegenerative diseases such as Alzheimer, Parkinson, SLA.. 
          
          Tasks done:
          - Working on migrating the infrastructure from on-premise to AWS cloud through Terraform & Terragrunt (multi-region EKS clusters).
          - Building CI/CD pipelines with Gitlab CI.
          - Building a powerful local development stack based on Devspace and K3s
          - Creation of helm charts to package the QyScore solution (4 helm packages aggregated as one meta-package)
          - Implementing monitoring solutions using Prometheus, Grafana, Tempo and Loki, with Alloy as agent.
      - role: Site Reliability Engineer
        time: October 2022 - March 2024
        company: Descours & Cabaud, Lyon (Freelance, Full-Remote)
        details: |
          Descours & Cabaud is a major player in the distribution of industrial equipment, tools and consumables
          for professionals in France and Europe.
          
          Tasks done:
          - Working on migrating legacy applications to Kubernetes clusters on Azure Cloud, using Docker, Helm, and Terraform.
          - Maintain legacy deployment system for on-premises servers with ansible playbooks
          - Configure complex RabbitMQ brokers.
          - Creating from scratch CI/CD gitlab pipelines. 
      - role: Automation Engineer
        time: January 2020 - August 2020
        company: Globaz SA, Le Noirmont, Switzerland
        details: |
          Globaz SA develops an application named AVS4.0, a solution for the Swiss insurance funds AS/AVS. 
          Six developers were assigned to AVS4, and a two devops team. The application, mostly developed in java springs, 
          was regularly released as docker-compose files.
          
          Tasks done:
          - Maintenance and improvement of a docker swarm infrastructure on Vmware machines in a local datacenter. 
          - Maintenance of jenkins CI/CD servers, deployment of a new solution with gitlab-ci.
          - Implementation and configuration of a centralized log stack (ELK) and improvement of the monitoring layer (Prometheus / Grafana).
      - role: Cloud consultant
        time: April 2018 - December 2019
        company: Osones, Paris
        details: |
          Consultant at Osones, who places cloud experts with customers who want to migrate to a cloud solution (openstack and / or kubernetes).
          
          Ł’express: 
            - Realization of a containerized development stack for a legacy application in php5, realized with docker-compose, mac / windows compatible. 
            - Deployment of a staging environment for the journalists’ editing tool via a packer / terraform / AWS package (small project - 2 EC2 machines, 1 Mysql RDS). 
          
          Cap-Loisirs: 
            - Improvment of AWS CI/CD Pipelines (AWS CodeBuild, AWS CodePipeline) 
            - Multiples database migrations to AWS (through AWS DMS service). 
          
          Skiset : 
            - Deployment and configuration a kubernetes cluster on AWS 
            - Containerization of non-cloud-native applications. 
            - Creation of a complete CI/CD tool (gitlab-ci) and implementation of datadog. 

      - role: System administrator
        time: November 2015 - March 2018
        company: Xilopix, Epinal
        details: |
          I was hired to support and administrate the company’s information system; Xilopix developed a new kind of search engine, and I was reinforcing 
          the system administrator in place, who left shortly after my arrival. I early managed two others system administrators, 6 months after my arrival.
          
          Tasks done:
          - Maintenance and improvement of infrastructure, monitoring and backups (All services were hosted on LXC containers on local hosts, LDAP, DHCP, DNS, routing, nodejs and ruby registries, openvpn) 
          - Management of the company’s lab (6 bare-metal machines), and its network layer 
          - Maintenance and improvement of the configuration automation layer (Puppet 3, then ansible)
          - VPS deployment automation via the OVH public cloud (openstack) using terraform. 

