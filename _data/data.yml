career-profile:
    title: Career Profile
    summary: |
      I am a Site Reliability Engineer & Devops with more than 10 years of experiences, with a large set of skills.
      From local development stacks to production-grades environment, I'm more than able and very enthousiast to work on:
      - Infrastructure as code : Terraform and T.erragrunt, for cloud providers like AWS, Azure, OVH (No GCP yet)
      - Containers technologies: Kubernetes, Docker (compose & swarm included), LXC. 
      - CI/CD pipelines: Github Actions, Gitlab CI
      - Configuration Management: Ansible
      - Monitoring Stack (Prometheus, Grafana, Loki, Alloy, ELK)
      - Efficients Local stack environments (Devspace, K3S, etc...)
      - Documentation as Code (Docusaurus, Mkdocs) 

